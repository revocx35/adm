# ADM - agentic download manager. Copy .env.example to .env, set the library mounts below, then:
#   mkdir -p data staging && sudo chown 1000:1000 data staging && docker compose up -d
#   docker logs adm 2>&1 | grep 'setup code'
services:
  adm:
    container_name: adm
    image: ${ADM_IMAGE:-ghcr.io/revocx35/adm:${ADM_VERSION:-latest}}
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADM_HTTPS_PORT:-8450}:${ADM_HTTPS_PORT:-8450}"
    volumes:
      - ./data:/data
      # uploads in progress; ideally on the same file system as the libraries (then imports are instant)
      - ${ADM_STAGING_HOST:-./staging}:/staging
      # every library folder lives below /libraries (ADM_LIBRARY_ROOTS); writable for uid 1000
      - ${ADM_MOVIES_HOST:-./libraries/movies}:/libraries/movies
      - ${ADM_SHOWS_HOST:-./libraries/shows}:/libraries/shows
      - ${ADM_BOOKS_HOST:-./libraries/books}:/libraries/books
    environment:
      ADM_STAGING_DIR: /staging
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
